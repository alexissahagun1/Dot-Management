<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — DOT Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/a.css">
</head>
<body class="a-contact">
  <a class="skip" href="#content">Skip to content</a>
  <header class="chrome">
    <a class="brand" href="home.html"><img class="lockup" src="img/logo-ink.png" alt="DOT Management"></a>
    <a class="ham" href="overlay.html" aria-label="Open menu"><span></span><span></span><span></span></a>
  </header>
  <main id="content">
    <div class="brief">
      <h1>Send a briefing.</h1>
      <form action="#" method="post" onsubmit="return false">
        <label><span>Name</span><input type="text" name="name" autocomplete="name"></label>
        <label><span>Category / series</span><input type="text" name="series"></label>
        <label><span>Message</span><textarea name="message"></textarea></label>
        <button class="go" type="submit">Send →</button>
      </form>
    </div>
    <p class="alt">
      <a href="https://instagram.com/dotmanagement_">@dotmanagement_</a>
      <a href="mailto:info@dotsportsmanagement.com">info@dotsportsmanagement.com</a>
    </p>
  </main>
</body>
</html>
